<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スノーマンAR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg-top: #dcecf7; --bg-bottom: #f7fbfe; --ink: #17324a; --muted: #48637a; --accent: #c8102e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink);
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }

  model-viewer { flex: 1; min-height: 0; width: 100%; background: transparent; --poster-color: transparent; }

  #ar-button { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    min-height: 56px; padding: 0 32px; border: 0; border-radius: 999px; white-space: nowrap; cursor: pointer;
    color: #fff; background: var(--accent); font: inherit; font-size: 18px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  #ar-button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  #progress { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(0,0,0,.08); }
  #progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  #guide { flex: none; margin: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    min-height: 92px; text-align: center; font-size: 15px; line-height: 1.6; color: var(--muted); }
  #guide.error { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <model-viewer id="viewer"
    src="assets/models/snowman_merry_christmas.glb?v=2"
    alt="足元に金色のMerry Christmasの文字がある、動くスノーマンの3Dモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="none"
    autoplay
    shadow-intensity="1"
    exposure="1">
    <button id="ar-button" slot="ar-button">机の上に置く</button>
    <div id="progress" slot="progress-bar"><span></span></div>
  </model-viewer>

  <p id="guide">読み込み中です…</p>

<script type="module">
const viewer = document.getElementById('viewer');
const guide = document.getElementById('guide');
const bar = document.querySelector('#progress span');
const GUIDE_AR = '「机の上に置く」を押して、カメラを机にゆっくり向けてください。指で動かしたり、大きさを変えたりできます。';
const GUIDE_NO_AR = 'この端末ではARを使えないため、画面の中で表示しています。指で回して見られます。';

function setGuide(text, isError) {
  guide.textContent = text;
  guide.classList.toggle('error', Boolean(isError));
}

viewer.addEventListener('progress', e => {
  const p = e.detail.totalProgress;
  bar.style.width = `${p * 100}%`;
  document.getElementById('progress').hidden = p >= 1;
});

viewer.addEventListener('load', () => {
  setGuide(viewer.canActivateAR ? GUIDE_AR : GUIDE_NO_AR);
});

viewer.addEventListener('error', () => {
  setGuide('スノーマンを読み込めませんでした。通信状況を確認して、ページを開き直してください。', true);
});

viewer.addEventListener('ar-status', e => {
  if (e.detail.status === 'failed') {
    setGuide('ARを起動できませんでした。Androidの方はChrome、iPhoneの方はSafariで開いてください。', true);
  }
});
</script>
</body>
</html>
